<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Habit Tracker</title>
    <!-- Google Fonts for modern typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-theme">
    <div class="app-container">
        <!-- Header -->
        <header>
            <div class="header-top">
                <h1>Habits</h1>
                <button id="theme-toggle" class="theme-btn" aria-label="Toggle Theme">
                    <svg id="sun-icon" class="icon hidden" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                    <svg id="moon-icon" class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                </button>
            </div>
            
            <div class="progress-dashboard">
                <div class="progress-card daily">
                    <h3>Daily Goal</h3>
                    <div class="progress-bar-container">
                        <div id="daily-progress-bar" class="progress-bar"></div>
                    </div>
                    <span id="daily-progress-text">0% Completed</span>
                </div>
                <div class="stats-row">
                    <div class="stat-card">
                        <span class="stat-label">This Month</span>
                        <div id="monthly-progress" class="stat-value">0</div>
                    </div>
                    <div class="stat-card">
                        <span class="stat-label">This Year</span>
                        <div id="yearly-progress" class="stat-value">0</div>
                    </div>
                </div>
            </div>

            <div class="add-habit-container">
                <input type="text" id="habit-input" placeholder="What habit do you want to build?">
                <button id="add-btn" class="primary-btn">Add Habit</button>
            </div>
            
            <div class="filters">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="pending">Pending</button>
                <button class="filter-btn" data-filter="completed">Completed</button>
            </div>
        </header>

        <!-- Main Content -->
        <main>
            <div id="empty-state" class="empty-state">
                <svg width="120" height="120" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" class="empty-svg"><circle cx="12" cy="12" r="10"></circle><path d="M8 12h8"></path><path d="M12 8v8"></path></svg>
                <h2>Start Building Habits</h2>
                <p>Add your first habit above to begin your journey.</p>
            </div>

            <ul id="habit-list" class="habit-list">
                <!-- Habits will be rendered here -->
            </ul>
        </main>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
